<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>🔐 Admin Panel</h1></header>
  <main>

    <!-- Login -->
    <section id="login" class="box">
      <input id="owner" placeholder="GitHub username">
      <input id="repo" placeholder="Repository নাম (যেমন my-notebook)">
      <input id="branch" placeholder="Branch" value="main">
      <input id="token" type="password" placeholder="Admin Password (GitHub Token)">
      <button onclick="login()">Login</button>
      <div id="loginMsg" style="color:#dc2626"></div>
    </section>

    <!-- Panel -->
    <div id="panel" hidden style="display:none;gap:14px;">
      <section class="box">
        <h3>নতুন Topic</h3>
        <input id="newTopic" placeholder="Topic নাম (যেমন Physics)">
        <button onclick="addTopic()">Topic যোগ করো</button>
      </section>

      <section class="box">
        <h3>ফাইল Upload</h3>
        <select id="topic"></select>
        <input id="title" placeholder="শিরোনাম (ঐচ্ছিক, একটা ফাইল হলে)">
        <input id="files" type="file" multiple accept="image/*,application/pdf">
        <button onclick="upload()">Upload করো</button>
        <div id="status"></div>
      </section>

      <section class="box">
        <h3>আপলোড করা ফাইল</h3>
        <div id="items"></div>
      </section>

      <button class="btn del" onclick="logout()">Logout</button>
    </div>
  </main>

<script>
const $ = id => document.getElementById(id);
let cfg = JSON.parse(sessionStorage.getItem('cfg') || 'null');

async function gh(path, opts = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    }
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || ('Error ' + r.status));
  return j;
}

const base = () => `/repos/${cfg.owner}/${cfg.repo}/contents/`;
const enc = s => btoa(unescape(encodeURIComponent(s)));
const dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));

async function loadData() {
  const j = await gh(base() + 'data.json?ref=' + cfg.branch);
  return { data: JSON.parse(dec(j.content)), sha: j.sha };
}

async function saveData(data, sha) {
  await gh(base() + 'data.json', {
    method: 'PUT',
    body: JSON.stringify({
      message: 'update data.json',
      content: enc(JSON.stringify(data, null, 2)),
      sha, branch: cfg.branch
    })
  });
}

function toB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function login() {
  cfg = {
    owner: $('owner').value.trim(),
    repo: $('repo').value.trim(),
    branch: $('branch').value.trim() || 'main',
    token: $('token').value.trim()
  };
  try {
    await loadData();
    sessionStorage.setItem('cfg', JSON.stringify(cfg));
    showPanel();
  } catch (e) {
    $('loginMsg').textContent = 'Login ব্যর্থ: ' + e.message;
  }
}

function logout() {
  sessionStorage.removeItem('cfg');
  location.reload();
}

function showPanel() {
  $('login').style.display = 'none';
  $('panel').style.display = 'grid';
  refresh();
}

async function refresh() {
  const { data } = await loadData();
  $('topic').innerHTML = '';
  data.topics.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    $('topic').appendChild(o);
  });

  const box = $('items');
  box.innerHTML = '';
  [...data.items].reverse().forEach(i => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px';
    const info = document.createElement('span');
    info.textContent = `[${i.topic}] ${i.title} — ${new Date(i.date).toLocaleDateString('bn-BD')}`;
    const b = document.createElement('button');
    b.className = 'btn del'; b.textContent = 'মুছো';
    b.onclick = () => del(i);
    row.append(info, b);
    box.appendChild(row);
  });
}

async function addTopic() {
  const name = $('newTopic').value.trim();
  if (!name) return;
  try {
    const { data, sha } = await loadData();
    if (!data.topics.includes(name)) data.topics.push(name);
    await saveData(data, sha);
    $('newTopic').value = '';
    refresh();
  } catch (e) { alert(e.message); }
}

async function upload() {
  const files = [...$('files').files];
  const topic = $('topic').value;
  if (!topic || !files.length) return alert('Topic ও ফাইল বাছাই করো');
  try {
    const newItems = [];
    for (const f of files) {
      const isPdf = f.type === 'application/pdf';
      const isImg = f.type.startsWith('image/');
      if (!isPdf && !isImg) continue;
      $('status').textContent = 'আপলোড হচ্ছে: ' + f.name;
      const safe = Date.now() + '-' + f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = 'files/' + safe;
      await gh(base() + path, {
        method: 'PUT',
        body: JSON.stringify({
          message: 'add ' + safe,
          content: await toB64(f),
          branch: cfg.branch
        })
      });
      newItems.push({
        id: safe,
        topic,
        title: (files.length === 1 && $('title').value.trim()) || f.name.replace(/\.[^.]+$/, ''),
        type: isPdf ? 'pdf' : 'image',
        path,
        name: f.name,
        date: new Date().toISOString()
      });
    }
    const { data, sha } = await loadData();
    data.items.push(...newItems);
    await saveData(data, sha);
    $('status').textContent = '✅ সফলভাবে আপলোড হয়েছে! (সাইটে দেখাতে ১-২ মিনিট লাগতে পারে)';
    $('files').value = ''; $('title').value = '';
    refresh();
  } catch (e) {
    $('status').style.color = '#dc2626';
    $('status').textContent = 'ত্রুটি: ' + e.message;
  }
}

async function del(item) {
  if (!confirm('সত্যিই মুছে ফেলবে?')) return;
  try {
    const f = await gh(base() + item.path + '?ref=' + cfg.branch);
    await gh(base() + item.path, {
      method: 'DELETE',
      body: JSON.stringify({ message: 'delete ' + item.id, sha: f.sha, branch: cfg.branch })
    });
    const { data, sha } = await loadData();
    data.items = data.items.filter(x => x.id !== item.id);
    await saveData(data, sha);
    refresh();
  } catch (e) { alert(e.message); }
}

if (cfg) showPanel();
</script>
</body>
</html>
