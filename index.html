<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আমার Notebook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📚 আমার Notebook</h1>
  <button class="light" id="adminBtn">Admin</button>
</header>

<main>
  <!-- Admin login -->
  <div class="panel" id="loginPanel">
    <h3>Admin Login</h3>
    <input type="password" id="tokenInput" placeholder="GitHub Token দিন">
    <button id="loginBtn">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Admin upload -->
  <div class="panel" id="uploadPanel">
    <h3>নতুন Upload (Admin)</h3>
    <select id="topicSelect"></select>
    <input type="text" id="newTopic" placeholder="অথবা নতুন Topic-এর নাম লিখুন (ঐচ্ছিক)">
    <input type="text" id="titleInput" placeholder="Title (ফাঁকা রাখলে ফাইলের নাম)">
    <input type="file" id="fileInput" accept="image/*,.pdf" multiple>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button id="uploadBtn">Upload</button>
      <button class="light" id="logoutBtn">Logout</button>
    </div>
    <div class="msg" id="upMsg"></div>
  </div>

  <div class="chips" id="chips"></div>
  <input class="search" id="search" placeholder="🔍 খুঁজুন...">
  <div class="grid" id="grid"></div>
</main>

<script>
const OWNER = "rafsanlearns";
const REPO  = "notebook";
const API   = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

let data = {topics: [], items: []};
let activeTopic = "সব";
let token = localStorage.getItem("nb_token") || "";
const $ = id => document.getElementById(id);

/* ---------- Helpers ---------- */
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const fmtDate = d => new Date(d).toLocaleDateString("bn-BD", {day:"numeric", month:"long", year:"numeric"});
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isImg = p => /\.(jpe?g|png|gif|webp|bmp)$/i.test(p);

function gh(path, opts = {}) {
  return fetch(API + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    }
  });
}

/* ---------- Load & Render ---------- */
async function load() {
  try {
    if (token) {
      const r = await gh("data.json");
      if (r.ok) { data = JSON.parse(b64dec((await r.json()).content)); }
    } else {
      const r = await fetch("data.json?t=" + Date.now());
      data = await r.json();
    }
  } catch (e) { console.error(e); }
  render();
}

function render() {
  // chips
  const tops = ["সব", ...data.topics];
  $("chips").innerHTML = tops.map(t =>
    `<div class="chip ${t === activeTopic ? "active" : ""}" data-t="${esc(t)}">${esc(t)}</div>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { activeTopic = c.dataset.t; render(); });

  // topic select (admin)
  $("topicSelect").innerHTML = data.topics.map(t => `<option>${esc(t)}</option>`).join("");

  // items
  const q = $("search").value.trim().toLowerCase();
  const list = data.items
    .filter(i => activeTopic === "সব" || i.topic === activeTopic)
    .filter(i => !q || i.title.toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date));

  if (!list.length) { $("grid").innerHTML = `<div class="empty">কিছু পাওয়া যায়নি</div>`; return; }

  $("grid").innerHTML = list.map(i => `
    <div class="card">
      <div class="thumb">${isImg(i.path) ? `<img src="${i.path}" loading="lazy">` : "📄"}</div>
      <div class="info">
        <div class="date">📅 ${fmtDate(i.date)}</div>
        <div class="title">${esc(i.title)}</div>
        <div class="topic">${esc(i.topic)}</div>
      </div>
      <div class="actions">
        <a class="btn light" href="${i.path}" target="_blank">দেখুন</a>
        <a class="btn" href="${i.path}" download>Download</a>
        ${token ? `<button class="danger" onclick="del('${i.id}')">Delete</button>` : ""}
      </div>
    </div>`).join("");
}

/* ---------- Admin UI ---------- */
function showAdmin() {
  $("uploadPanel").classList.toggle("show", !!token);
  $("loginPanel").classList.remove("show");
}
$("adminBtn").onclick = () => {
  if (token) $("uploadPanel").classList.toggle("show");
  else $("loginPanel").classList.toggle("show");
};

$("loginBtn").onclick = async () => {
  const t = $("tokenInput").value.trim();
  if (!t) return;
  $("loginMsg").textContent = "যাচাই করা হচ্ছে...";
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
    headers: {"Authorization": "Bearer " + t}
  });
  const j = await r.json();
  if (r.ok && j.permissions && j.permissions.push) {
    token = t;
    localStorage.setItem("nb_token", t);
    $("tokenInput").value = "";
    $("loginMsg").textContent = "";
    showAdmin();
    load();
  } else {
    $("loginMsg").textContent = "❌ ভুল Token বা অনুমতি নেই";
  }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("nb_token");
  token = "";
  $("uploadPanel").classList.remove("show");
  load();
};

/* ---------- Update data.json ---------- */
async function updateData(mutator, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await gh("data.json");
    const j = await r.json();
    const current = JSON.parse(b64dec(j.content));
    mutator(current);
    const put = await gh("data.json", {
      method: "PUT",
      body: JSON.stringify({message, content: b64enc(JSON.stringify(current, null, 2)), sha: j.sha})
    });
    if (put.ok) { data = current; return; }
    if (put.status !== 409) throw new Error("data.json সেভ হয়নি");
  }
  throw new Error("বারবার চেষ্টা করেও সেভ হয়নি");
}

/* ---------- Upload ---------- */
const toBase64 = file => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result.split(",")[1]);
  fr.onerror = rej;
  fr.readAsDataURL(file);
});

$("uploadBtn").onclick = async () => {
  const files = [...$("fileInput").files];
  const topic = $("newTopic").value.trim() || $("topicSelect").value;
  if (!files.length) { $("upMsg").textContent = "ফাইল বাছাই করুন"; return; }
  if (!topic) { $("upMsg").textContent = "Topic দিন"; return; }

  $("uploadBtn").disabled = true;
  const date = new Date().toISOString().slice(0, 10);
  const newItems = [];

  try {
    for (let n = 0; n < files.length; n++) {
      const f = files[n];
      $("upMsg").textContent = `আপলোড হচ্ছে ${n + 1}/${files.length}: ${f.name}`;
      const safe = Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = "files/" + safe;
      const r = await gh(path, {
        method: "PUT",
        body: JSON.stringify({message: "Upload " + safe, content: await toBase64(f)})
      });
      if (!r.ok) throw new Error(f.name + " আপলোড হয়নি (সাইজ বেশি হতে পারে)");
      const title = (files.length === 1 && $("titleInput").value.trim()) || f.name.replace(/\.[^.]+$/, "");
      newItems.push({id: "i" + Date.now() + n, topic, title, path, date});
    }
    await updateData(d => {
      if (!d.topics.includes(topic)) d.topics.push(topic);
      d.items.push(...newItems);
    }, "Add items");

    $("upMsg").textContent = "✅ আপলোড সফল! (সবার কাছে দেখাতে ১-২ মিনিট লাগতে পারে)";
    $("fileInput").value = ""; $("titleInput").value = ""; $("newTopic").value = "";
    render();
  } catch (e) {
    $("upMsg").textContent = "❌ " + e.message;
  }
  $("uploadBtn").disabled = false;
};

/* ---------- Delete ---------- */
async function del(id) {
  if (!confirm("সত্যিই মুছে ফেলবেন?")) return;
  const item = data.items.find(i => i.id === id);
  try {
    const r = await gh(item.path);
    if (r.ok) {
      const j = await r.json();
      await gh(item.path, {method: "DELETE", body: JSON.stringify({message: "Delete " + item.path, sha: j.sha})});
    }
    await updateData(d => { d.items = d.items.filter(i => i.id !== id); }, "Remove item");
    render();
  } catch (e) { alert("❌ " + e.message); }
}

$("search").oninput = render;
showAdmin();
load();
</script>
</body>
</html>
