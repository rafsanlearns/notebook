<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup</title>
<style>
body{font-family:system-ui,sans-serif;padding:18px;max-width:480px;margin:auto}
input,textarea,button{width:100%;padding:13px;margin:6px 0;font-size:16px;box-sizing:border-box;border-radius:10px;border:1px solid #ccc}
button{background:#4f46e5;color:#fff;border:0;font-weight:600}
</style>
</head>
<body>
<h3>🔒 Token তালা দিন</h3>
<input id="t" placeholder="GitHub Token (github_pat_...)">
<input id="p" placeholder="Admin Password">
<button onclick="go()">তালা দাও</button>
<textarea id="o" rows="7" readonly placeholder="এখানে ফলাফল আসবে"></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('o').value)">Copy করো</button>
<script>
async function go(){
  const $=id=>document.getElementById(id);
  const te=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey('raw',te.encode($('p').value.trim()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode($('t').value.trim())));
  const all=new Uint8Array(28+ct.length);
  all.set(salt,0); all.set(iv,16); all.set(ct,28);
  let s=''; all.forEach(b=>s+=String.fromCharCode(b));
  $('o').value='const ENC_TOKEN = "'+btoa(s)+'";';
}
</script>
</body>
</html>
